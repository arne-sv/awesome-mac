<script>
/* ============================================================
   Prototyp: Schadenbearbeitung für Sachverständige
   - Daten liegen nur im Browser (localStorage). Kein Backend.
   - Ziel: Abläufe und Assistenzlogik greifbar machen, nicht Produktion.
   ============================================================ */

const TODAY = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});

/* ---------- Sparten-Workflows (Vorlagen) ----------
   Jeder Schritt: Titel, Frist in Tagen ab Auftragseingang, optional Auslöser.
   Eine Akte kopiert die Vorlage und kann sie danach frei ändern. */
const SPARTEN = {
  'Leitungswasser': [
    {t:'Auftrag prüfen & Akte anlegen',d:0},{t:'Kontakt VN aufnehmen',d:1},
    {t:'Ortstermin vereinbaren',d:2,kind:'termin'},{t:'Ortstermin durchführen',d:5},
    {t:'Leckageortung / Trocknung prüfen',d:7},{t:'Sanierungsangebot prüfen',d:10,kind:'pruefung'},
    {t:'Gutachten erstellen',d:14,kind:'gutachten'},{t:'Rechnung prüfen',d:30,kind:'pruefung'},
    {t:'Honorar abrechnen',d:31},{t:'Akte schließen',d:35}],
  'Sturm/Hagel': [
    {t:'Auftrag prüfen & Akte anlegen',d:0},{t:'Wetterdaten abrufen (DWD)',d:1},
    {t:'Ortstermin vereinbaren',d:2,kind:'termin'},{t:'Ortstermin durchführen',d:5},
    {t:'Dachdeckerangebot prüfen',d:8,kind:'pruefung'},{t:'Gutachten erstellen',d:12,kind:'gutachten'},
    {t:'Honorar abrechnen',d:14},{t:'Akte schließen',d:20}],
  'Feuer': [
    {t:'Auftrag prüfen & Akte anlegen',d:0},{t:'Sofortkontakt VN',d:0},
    {t:'Ortstermin vereinbaren',d:1,kind:'termin'},{t:'Ortstermin durchführen',d:2},
    {t:'Ermittlungsakte anfordern',d:3},{t:'Sanierungsangebote prüfen',d:14,kind:'pruefung'},
    {t:'Zwischenbericht an VR',d:10},{t:'Gutachten erstellen',d:21,kind:'gutachten'},
    {t:'Rechnungen prüfen',d:45,kind:'pruefung'},{t:'Honorar abrechnen',d:46},{t:'Akte schließen',d:50}],
  'Kfz': [
    {t:'Auftrag prüfen & Akte anlegen',d:0},{t:'Besichtigungstermin vereinbaren',d:1,kind:'termin'},
    {t:'Fahrzeugbesichtigung',d:3},{t:'Kalkulation erstellen',d:4},
    {t:'Gutachten erstellen',d:5,kind:'gutachten'},{t:'Honorar abrechnen',d:6},{t:'Akte schließen',d:10}],
};

/* ---------- Gutachten-Maske: strukturierte Felder ----------
   Alle Felder liegen in der Akte und sind auswertbar (Statistik, Suche, PDF). */
const GUTACHTEN_FELDER = [
  ['schadentag','Schadentag','date'],['ursache','Schadenursache','select',['Leitungswasser','Sturm','Hagel','Feuer','Elementar','Einbruch','Unfall','Sonstige']],
  ['ursache_detail','Ursache im Detail','textarea'],['befund','Befund Ortstermin','textarea'],
  ['betroffene_raeume','Betroffene Räume / Bauteile','textarea'],['flaeche_m2','Betroffene Fläche (m²)','number'],
  ['deckung','Deckung gegeben?','select',['ja','nein','teilweise','offen']],['vorschaden','Vorschäden','textarea'],
  ['massnahmen','Empfohlene Maßnahmen','textarea'],['schadenhoehe_netto','Ermittelte Schadenhöhe netto (€)','number'],
  ['zeitwert_abzug','Abzug neu für alt (€)','number'],['regress','Regressmöglichkeit','select',['keine','prüfen','ja']],
  ['fazit','Fazit','textarea'],
];

/* ---------- Demo-Daten ---------- */
function demo(){
  const t=TODAY();
  const mk=(o)=>({id:uid(),notizen:[],emails:[],termine:[],pruefungen:[],gutachten:{},erledigteAufgaben:[],status:'offen',...o,
    workflow:SPARTEN[o.sparte].map(s=>({...s,id:uid(),done:false,faellig:addDays(o.eingang,s.d)}))});
  const a1=mk({az:'SV-2026-0141',schadennr:'LW-883421',sparte:'Leitungswasser',auftraggeber:'Musterversicherung AG',sachbearbeiter:'Fr. Klein',
    vn:'Familie Becker',tel:'0221 555 1234',mail:'becker@example.de',ort:'Venloer Str. 12, 50672 Köln',lat:50.943,lon:6.937,eingang:addDays(t,-6),
    beschreibung:'Wasseraustritt Küche EG, Feuchtigkeit in Wand zum Bad.'});
  a1.workflow[0].done=a1.workflow[1].done=true;

    vn:'Hr. Yilmaz',tel:'0211 444 222',mail:'yilmaz@example.de',ort:'Kölner Str. 80, 40211 Düsseldorf',lat:51.222,lon:6.794,eingang:addDays(t,-2),

    {text:'Ozonbehandlung',menge:1,einheit:'psch',ep:1450,anerkannt_ep:1450},

    {text:'Baustelleneinrichtung',menge:1,einheit:'psch',ep:950,anerkannt_ep:400}],bemerkung:''});
  const inbox=[
    {id:uid(),von:'k.klein@musterversicherung.example',betreff:'Neuer Auftrag Schaden LW-990117 – Ortsbesichtigung',datum:t,
      text:'Sehr geehrte Damen und Herren,\nbitte übernehmen Sie Schaden LW-990117, VN Hr. Schulz, Ringstr. 4, 50996 Köln, Tel. 0221 777 888. Leitungswasserschaden Bad OG.\nMfG Klein',zugeordnet:null},
    {id:uid(),von:'becker@example.de',betreff:'AW: SV-2026-0141 Termin',datum:t,
      text:'Hallo, wir können Donnerstag ab 9 Uhr. Grüße Becker',zugeordnet:null},
    {id:uid(),von:'info@sanierung-rhein.example',betreff:'Rechnung zu Schaden FE-2207',datum:addDays(t,-1),

let DB; try{DB=JSON.parse(localStorage.getItem('schadenakte'))}catch(e){}
if(!DB) DB=demo();
const save=()=>{try{localStorage.setItem('schadenakte',JSON.stringify(DB))}catch(e){}};
function resetDemo(){ if(confirm('Alle Daten auf Demo zurücksetzen?')){DB=demo();save();go('assistenz');} }

/* ============================================================
   ASSISTENZ-ENGINE
   Erzeugt Aufgaben und Erinnerungen aus dem Zustand der Akten.
   Der Sachverständige legt keine Aufgabe selbst an – sie entsteht aus Regeln.
   ============================================================ */
function aufgaben(){
  const out=[]; const t=TODAY();
  const push=(akte,key,text,faellig,prio,aktion)=>{
    if(akte && akte.erledigteAufgaben.includes(key)) return;
    out.push({akte,key,text,faellig,prio,aktion});
  };
  for(const a of DB.akten.filter(a=>a.status!=='abgeschlossen')){
    // 1) Nächster offener Workflow-Schritt
    const next=a.workflow.find(s=>!s.done);
    if(next){
      const diff=daysBetween(t,next.faellig);
      push(a,'wf:'+next.id,next.t,next.faellig,diff<0?3:diff<=1?2:1,{typ:'wf',id:next.id});
    }
    // 2) Termin nötig, aber keiner geplant
    const terminSchritt=a.workflow.find(s=>s.kind==='termin');
    if(terminSchritt && !terminSchritt.done && a.termine.length===0 && daysBetween(a.eingang,t)>=1)
      push(a,'kein-termin','Noch kein Ortstermin geplant – VN anrufen: '+a.tel,t,3,{typ:'tab',tab:'termine'});
    // 3) Termin morgen → Vorbereitung
    for(const tm of a.termine){
      if(tm.datum===addDays(t,1)) push(a,'vorb:'+tm.id,`Termin morgen ${tm.zeit} vorbereiten (Unterlagen, Messgeräte)`,t,2,{typ:'tab',tab:'termine'});
      if(tm.datum<t && !tm.protokoll) push(a,'prot:'+tm.id,`Protokoll für Termin vom ${fmt(tm.datum)} fehlt`,t,2,{typ:'tab',tab:'gutachten'});
    }
    // 4) Zugeordnete, ungelesene E-Mails
    for(const m of a.emails.filter(m=>!m.erledigt))
      push(a,'mail:'+m.id,'E-Mail bearbeiten: '+m.betreff,m.datum,2,{typ:'tab',tab:'kommunikation'});
    // 5) Prüfungen ohne Bericht
    for(const p of a.pruefungen.filter(p=>!p.versendet))
      push(a,'pr:'+p.id,`${p.typ}sprüfung ${p.firma} abschließen und versenden`,addDays(p.datum,5),2,{typ:'tab',tab:'pruefung'});
    // 6) Gutachten-Pflichtfelder unvollständig, obwohl Gutachten-Schritt ansteht
    const gs=a.workflow.find(s=>s.kind==='gutachten'&&!s.done);
    if(gs && daysBetween(t,gs.faellig)<=3){
      const fehlt=['ursache','befund','deckung','schadenhoehe_netto','fazit'].filter(k=>!a.gutachten[k]);
      if(fehlt.length) push(a,'gf:'+fehlt.join(),`Gutachten: ${fehlt.length} Pflichtfelder offen (${fehlt.join(', ')})`,gs.faellig,2,{typ:'tab',tab:'gutachten'});
    }
    // 7) Keine Aktivität seit 7 Tagen
    const last=[a.eingang,...a.notizen.map(n=>n.datum),...a.emails.map(m=>m.datum),...a.termine.map(x=>x.datum)].sort().pop();
    if(daysBetween(last,t)>=7) push(a,'ruhe:'+last,`Seit ${daysBetween(last,t)} Tagen keine Aktivität – Sachstand an ${a.sachbearbeiter} melden`,t,1,{typ:'tab',tab:'kommunikation'});
  }
  // 8) Nicht zugeordnete E-Mails im Posteingang
  const offen=DB.inbox.filter(m=>!m.zugeordnet).length;
  if(offen) out.push({akte:null,key:'inbox',text:`${offen} E-Mail(s) im Posteingang nicht zugeordnet`,faellig:t,prio:2,aktion:{typ:'view',view:'posteingang'}});
  return out.sort((x,y)=>y.prio-x.prio||x.faellig.localeCompare(y.faellig));
}
function aufgabeErledigt(aktenId,key,wfId){
  const a=DB.akten.find(a=>a.id===aktenId);
  if(wfId){ const s=a.workflow.find(s=>s.id===wfId); s.done=true; log(a,'Workflow: „'+s.t+'“ erledigt'); }
  else a.erledigteAufgaben.push(key);
  save(); render();
}

/* ---------- E-Mail-Zuordnung ----------
   Erkennt Aktenzeichen, Schadennummer oder Absenderadresse. */
function erkenneAkte(m){
  const txt=(m.betreff+' '+m.text).toUpperCase();
  return DB.akten.find(a=>txt.includes(a.az.toUpperCase())||txt.includes(a.schadennr.toUpperCase())||m.von.toLowerCase()===a.mail.toLowerCase());
}
function istNeuerAuftrag(m){ return /neuer auftrag|beauftrag|bitte übernehmen/i.test(m.betreff+' '+m.text); }
function extrahiereAuftrag(m){
  const g=(re)=>{const x=(m.text.match(re)||[])[1];return x?x.trim():''};
  const sparteRaw=/leitungswasser/i.test(m.text)?'Leitungswasser':/sturm|hagel/i.test(m.text)?'Sturm/Hagel':/brand|feuer/i.test(m.text)?'Feuer':/kfz|fahrzeug|unfall/i.test(m.text)?'Kfz':'Leitungswasser';
  return {schadennr:g(/Schaden\s+([A-Z]{1,3}-\d+)/i),vn:g(/VN\s+([^,]+)/),ort:g(/VN\s+[^,]+,\s*([^,]+,\s*\d{5}\s+[^\s.,]+)/),
    tel:g(/Tel\.?\s*([\d\s\/]+)/),sparte:sparteRaw,auftraggeber:m.von.split('@')[1]||'',beschreibung:m.text.split('\n').slice(1,3).join(' ')};
}
function zuordnen(mailId,aktenId){
  const m=DB.inbox.find(x=>x.id===mailId), a=DB.akten.find(x=>x.id===aktenId);
  m.zugeordnet=a.az; a.emails.push({...m,erledigt:false}); log(a,'E-Mail zugeordnet: '+m.betreff);
  save(); render();
}
function akteAusMail(mailId){
  const m=DB.inbox.find(x=>x.id===mailId); const d=extrahiereAuftrag(m);
  const a=neueAkte({...d,mail:'',lat:null,lon:null,sachbearbeiter:m.von});
  zuordnen(mailId,a.id); openAkte(a.id);
}
function neueAkte(d){
  const sparte=d.sparte||'Leitungswasser', eingang=TODAY();
  const a={id:uid(),az:'SV-2026-'+String(DB.nextNr++).padStart(4,'0'),schadennr:d.schadennr||'',sparte,auftraggeber:d.auftraggeber||'',
    sachbearbeiter:d.sachbearbeiter||'',vn:d.vn||'',tel:d.tel||'',mail:d.mail||'',ort:d.ort||'',lat:d.lat??null,lon:d.lon??null,eingang,
    beschreibung:d.beschreibung||'',status:'offen',notizen:[],emails:[],termine:[],pruefungen:[],gutachten:{},erledigteAufgaben:[],
    workflow:SPARTEN[sparte].map(s=>({...s,id:uid(),done:false,faellig:addDays(eingang,s.d)}))};
  DB.akten.unshift(a); log(a,'Akte angelegt'); save(); return a;
}
function log(a,text){ a.notizen.unshift({id:uid(),datum:TODAY(),typ:'system',text}); }
const fmt=d=>d?new Date(d).toLocaleDateString('de-DE'):'';

/* ---------- Routenplanung ----------
   Nächster-Nachbar-Heuristik ab Büro; Ausgabe als Google-Maps-Route. */
const BUERO={name:'Büro',lat:50.9375,lon:6.9603,ort:'Köln Innenstadt'};
function dist(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function route(stops){
  const rest=stops.filter(s=>s.lat!=null), order=[]; let cur=BUERO, km=0;
  while(rest.length){ rest.sort((x,y)=>dist(cur,x)-dist(cur,y)); const n=rest.shift(); km+=dist(cur,n); order.push(n); cur=n; }
  km+=order.length?dist(cur,BUERO):0;
  return {order,km:km*1.3}; // Faktor 1,3: Luftlinie → Straße (grobe Schätzung)
}

/* ============================================================
   PDF-ERZEUGUNG
   ============================================================ */
function pdfKopf(doc,titel,a){
  doc.setFontSize(16);doc.text(titel,14,18);doc.setFontSize(9);
  doc.text(`Aktenzeichen ${a.az}  ·  Schaden-Nr. ${a.schadennr}  ·  ${a.sparte}`,14,25);
  doc.text(`Auftraggeber: ${a.auftraggeber} (${a.sachbearbeiter})  ·  VN: ${a.vn}`,14,30);
  doc.text(`Risikoort: ${a.ort}  ·  Erstellt: ${fmt(TODAY())}`,14,35);
}
function pdfGutachten(a){
  const {jsPDF}=window.jspdf; if(!jsPDF) return alert('PDF-Bibliothek nicht geladen (offline?)');
  const doc=new jsPDF(); pdfKopf(doc,'Gutachten',a);
  doc.autoTable({startY:42,head:[['Feld','Inhalt']],columnStyles:{0:{cellWidth:55,fontStyle:'bold'}},
    body:GUTACHTEN_FELDER.map(([k,l,typ])=>[l,typ==='date'?fmt(a.gutachten[k]):(typ==='number'&&k.includes('hoehe')||k.includes('abzug'))&&a.gutachten[k]?eur(a.gutachten[k]):a.gutachten[k]||'—'])});
  if(a.termine.length){ doc.autoTable({startY:doc.lastAutoTable.finalY+8,head:[['Termin','Art','Protokoll']],
    body:a.termine.map(t=>[fmt(t.datum)+' '+t.zeit,t.art,t.protokoll||'—'])}); }
  doc.save(`${a.az}_Gutachten.pdf`); log(a,'Gutachten-PDF erstellt'); save();
}
function pdfPruefung(a,p){
  const {jsPDF}=window.jspdf; if(!jsPDF) return alert('PDF-Bibliothek nicht geladen (offline?)');
  const doc=new jsPDF(); pdfKopf(doc,p.typ+'sprüfung',a);
  doc.setFontSize(10);doc.text(`${p.typ} ${p.firma} vom ${fmt(p.datum)}`,14,43);
  const s=summen(p);
  doc.autoTable({startY:48,head:[['Position','Menge','EP gefordert','EP anerkannt','GP gefordert','GP anerkannt','Kürzung']],
    body:p.positionen.map(x=>[x.text,x.menge+' '+x.einheit,eur(x.ep),eur(x.anerkannt_ep),eur(x.menge*x.ep),eur(x.menge*x.anerkannt_ep),eur(x.menge*(x.ep-x.anerkannt_ep))]),
    foot:[['Summe netto','','','',eur(s.gef),eur(s.anr),eur(s.gef-s.anr)]],styles:{fontSize:8}});
  if(p.bemerkung){doc.setFontSize(9);doc.text(doc.splitTextToSize('Bemerkung: '+p.bemerkung,180),14,doc.lastAutoTable.finalY+8);}
  doc.save(`${a.az}_${p.typ}spruefung_${p.firma.replace(/\W+/g,'_')}.pdf`);
  p.versendet=true; log(a,`${p.typ}sprüfung ${p.firma} als PDF erstellt`); save(); render();
}

    <button class="btn primary" onclick="pdfPruefung(A('${a.id}'),A('${a.id}').pruefungen[${pi}])">Prüfbericht PDF</button></div>
  <table><tr><th>Position</th><th>Menge</th><th>EP gefordert</th><th>EP anerkannt</th><th>Kürzung</th></tr>
  ${p.positionen.map((x,i)=>`<tr><td><input value="${esc(x.text)}" onchange="pSet('${a.id}',${pi},${i},'text',this.value)"></td>
    <td><input type="number" value="${x.menge}" style="width:80px" onchange="pSet('${a.id}',${pi},${i},'menge',+this.value)"> ${esc(x.einheit)}</td>
    <td><input type="number" step="0.01" value="${x.ep}" onchange="pSet('${a.id}',${pi},${i},'ep',+this.value)"></td>
    <td><input type="number" step="0.01" value="${x.anerkannt_ep}" onchange="pSet('${a.id}',${pi},${i},'anerkannt_ep',+this.value)"></td>
    <td class="${x.ep>x.anerkannt_ep?'bad':''}">${eur(x.menge*(x.ep-x.anerkannt_ep))}</td></tr>`).join('')}
  <tr><td colspan="2"><button class="btn" onclick="pPos('${a.id}',${pi})">+ Position</button></td><td><b>${eur(s.gef)}</b></td><td><b>${eur(s.anr)}</b></td><td class="bad"><b>${eur(s.gef-s.anr)} (${s.gef?Math.round(100*(s.gef-s.anr)/s.gef):0} %)</b></td></tr></table>
  <label>Bemerkung</label><textarea onchange="A('${a.id}').pruefungen[${pi}].bemerkung=this.value;save()">${esc(p.bemerkung)}</textarea></div>`}).join('')+
  `<div class="card"><h2>Neue Prüfung</h2><div class="grid"><div><label>Typ</label><select id="p_typ"><option>Angebot</option><option>Rechnung</option></select></div>
    <div><label>Firma</label><input id="p_firma"></div><div><label>Datum Beleg</label><input id="p_dat" type="date" value="${TODAY()}"></div></div>
    <p><button class="btn primary" onclick="pNeu('${a.id}')">Anlegen</button></p></div>`;
}
function pSet(id,pi,i,k,v){A(id).pruefungen[pi].positionen[i][k]=v;save();render();}
function pPos(id,pi){A(id).pruefungen[pi].positionen.push({text:'',menge:1,einheit:'Stk',ep:0,anerkannt_ep:0});save();render();}
function pNeu(id){const f=val('p_firma');if(!f)return;const a=A(id);a.pruefungen.push({id:uid(),typ:val('p_typ'),firma:f,datum:val('p_dat'),positionen:[],bemerkung:''});log(a,val('p_typ')+'sprüfung angelegt: '+f);save();render();}

render();
</script>
</body>
</html>
