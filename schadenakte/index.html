<!doctype html>
<html lang="de">

<title>SchadenAkte Prototyp</title>

<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e2e5eb;--accent:#1f5fbf;--warn:#b5651d;--bad:#b3261e;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1c2028;--ink:#e6e8ec;--muted:#9aa3b5;--line:#2c323d;--accent:#6ea2ff;--warn:#e0a060;--bad:#ff7b72;--ok:#7bc77f}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1c2028;--ink:#e6e8ec;--muted:#9aa3b5;--line:#2c323d;--accent:#6ea2ff;--warn:#e0a060;--bad:#ff7b72;--ok:#7bc77f}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
nav button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
nav button.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;margin-left:4px}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.task .prio{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{border-left:3px solid var(--warn);padding:4px 10px;margin:6px 0;font-size:13px}
.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){main{padding:10px 16px}#aktentab th:nth-child(n+4),#aktentab td:nth-child(n+4){display:none}}

<body>
<header>
  <h1>SchadenAkte</h1>

  <button class="btn" onclick="resetDemo()">Demo zurücksetzen</button>

<main id="app"></main>

<script>
/* ============================================================
   Prototyp: Schadenbearbeitung für Sachverständige
   Sparten: Gebäude, Hausrat, Inhalt, Betriebsunterbrechung,
            Produkthaftpflicht, Transport, Marine (Binnenschifffahrt)
   Daten nur im Browser (localStorage). Kein Backend.
   Rechtliche Hinweise/Fristen sind Arbeitshilfen, keine Rechtsberatung.
   ============================================================ */

/* ---------- Datum & Format ---------- */
const iso = x => x.toISOString().slice(0,10);
const D = s => new Date(s+'T00:00:00Z');
const TODAY = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const addDays = (s,n) => { const x=D(s); x.setUTCDate(x.getUTCDate()+n); return iso(x); };
const addMonths = (s,n) => { const x=D(s); x.setUTCMonth(x.getUTCMonth()+n); return iso(x); };
const addYears = (s,n) => { const x=D(s); x.setUTCFullYear(x.getUTCFullYear()+n); return iso(x); };
const addOhneSonntag = (s,n) => { const x=D(s); while(n>0){ x.setUTCDate(x.getUTCDate()+1); if(x.getUTCDay()!==0) n--; } return iso(x); };
const daysBetween = (a,b) => Math.round((D(b)-D(a))/864e5);
const fmt = d => d ? D(d).toLocaleDateString('de-DE',{timeZone:'UTC'}) : '';
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num = v => (v===''||v==null) ? null : Number(v);

/* ============================================================
   SPARTEN: Workflow-Vorlage (Schritte mit Frist T+Tage) + Felder
   kind: termin | pruefung | gutachten  (steuern Assistenz-Regeln)
   ============================================================ */
const SPARTEN = {
  'Gebäude': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Kontakt VN aufnehmen',1],['Ortstermin vereinbaren',2,'termin'],['Ortstermin durchführen',5],
    ['Ursache feststellen (Leckage/Sturm/Brand)',7],['Sanierungsangebot prüfen',10,'pruefung'],['Gutachten erstellen',14,'gutachten'],
    ['Rechnung prüfen',30,'pruefung'],['Honorar abrechnen',31],['Akte schließen',35]],
    felder:[['schadenart','Schadenart','select',['Leitungswasser','Sturm','Hagel','Feuer','Elementar','Einbruch','Sonstige'],1],
      ['baujahr','Baujahr','number'],['bauteile','Betroffene Bauteile / Räume','textarea'],['flaeche_m2','Betroffene Fläche (m²)','number'],
      ['vs','Versicherungssumme (€)','eur'],['vw','Versicherungswert lt. SV (€)','eur'],['nfa','Abzug neu für alt (€)','eur']] },
  'Hausrat': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Kontakt VN, Schaden-/Stehlgutliste anfordern',1],['Ortstermin vereinbaren',2,'termin'],
    ['Ortstermin durchführen',5],['Schadenliste bewerten (Neuwert/Zeitwert)',10],['Unterversicherung prüfen',11],
    ['Gutachten erstellen',14,'gutachten'],['Honorar abrechnen',15],['Akte schließen',20]],
    felder:[['schadenart','Schadenart','select',['Einbruchdiebstahl','Leitungswasser','Feuer','Sturm/Hagel','Raub','Vandalismus','Sonstige'],1],
      ['wohnflaeche_m2','Wohnfläche (m²)','number'],['polizei_az','Polizeiliches Aktenzeichen','text'],['schadenliste','Schaden-/Stehlgutliste','textarea'],
      ['vs','Versicherungssumme (€)','eur'],['vw','Versicherungswert lt. SV (€)','eur']] },
  'Inhalt': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Kontakt VN',1],['Ortstermin vereinbaren',2,'termin'],['Ortstermin durchführen',4],
    ['Inventar, Bestandslisten & Anlagenverzeichnis anfordern',5],['Bewertung Einrichtung & Vorräte',12],['Restwerte / Verwertung klären',14],
    ['Sanierungsangebot prüfen',14,'pruefung'],['Unterversicherung prüfen',15],['Gutachten erstellen',21,'gutachten'],['Honorar abrechnen',22],['Akte schließen',30]],
    felder:[['betriebsart','Betriebsart','text',null,1],['einrichtung_wert','Schaden Betriebseinrichtung (€)','eur'],['vorraete_wert','Schaden Vorräte (€)','eur'],
      ['restwert','Restwerte / Verwertungserlös (€)','eur'],['vs','Versicherungssumme (€)','eur'],['vw','Versicherungswert lt. SV (€)','eur']] },
  'Betriebsunterbrechung': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Erstgespräch Geschäftsführung / Steuerberater',2],
    ['Unterlagen anfordern (Jahresabschlüsse 3 J., BWA, Planung)',3],['Ortstermin vereinbaren',3,'termin'],['Ortstermin durchführen',5],
    ['Schadenminderungsmaßnahmen abstimmen',7],['Zwischenberechnung / Abschlagszahlung',45],['Endabrechnung nach Haftzeit',380],
    ['Gutachten erstellen',395,'gutachten'],['Honorar abrechnen',396],['Akte schließen',400]],
    felder:[['unterbrechung_von','Unterbrechung ab','date',null,1],['haftzeit','Haftzeit (Monate)','number',null,1],
      ['wiederanlauf','Wiederanlauf (voll) am','date'],['bedingungen','Bedingungswerk (z. B. FBUB)','text']] },
  'Produkthaftpflicht': { wf:[
    ['Auftrag & Deckungsrahmen prüfen',0],['Beteiligte erfassen (Anspruchsteller, Hersteller, Händler, Anwälte)',1],
    ['Schadenstück sichern (Beweissicherung)',2],['Gemeinsamen Besichtigungstermin abstimmen',5,'termin'],['Gemeinsame Besichtigung',10],
    ['Laboruntersuchung / Fachgutachten beauftragen',14],['Ursachenbericht',30],['Schadenhöhe Anspruchsteller prüfen',35,'pruefung'],
    ['Gutachten erstellen',40,'gutachten'],['Honorar abrechnen',41],['Akte schließen',50]],
    felder:[['produkt','Produkt / Typ / Charge','text',null,1],['hersteller','Hersteller','text',null,1],['fehlerart','Fehlerart','select',['Konstruktion','Fabrikation','Instruktion','Produktbeobachtung','unklar']],
      ['anspruchsteller','Anspruchsteller','text'],['nutzung','Beschädigte Sache genutzt','select',['privat','gewerblich']],
      ['kenntnis','Kenntnis Anspruchsteller (Schaden+Fehler+Hersteller)','date',null,1],['inverkehr','Inverkehrbringen des Produkts','date']] },
  'Transport': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Besichtigung vereinbaren (Ware ggf. verderblich)',0,'termin'],
    ['Frachtpapiere anfordern (Frachtbrief, Lieferschein, Packliste, Rechnung)',1],['Schadenvorbehalt / Rügefrist prüfen',1],['Besichtigung durchführen',2],
    ['Schadenumfang, Restwert & Verwertung',5],['Haftung & Höchstbetrag Frachtführer',7],['Regressanzeige an Frachtführer',7],
    ['Gutachten erstellen',14,'gutachten'],['Honorar abrechnen',15],['Akte schließen',20]],
    felder:[['rechtsgrundlage','Rechtsgrundlage','select',['CMR','HGB (national)','CMNI (Binnenschiff int.)','Sonstige'],1],['frachtfuehrer','Frachtführer','text',null,1],
      ['absender','Absender','text'],['empfaenger','Empfänger','text'],['relation','Relation (von – nach)','text'],['ware','Ware','text'],
      ['ablieferung','Ablieferung am','date',null,1],['erkennbar','Schaden bei Ablieferung','select',['äußerlich erkennbar','nicht erkennbar']],
      ['vorbehalt','Vorbehalt/Schadenanzeige erfolgt am','date'],['gewicht_kg','Rohgewicht beschädigter Teil (kg)','number'],
      ['packstuecke','Anzahl beschädigter Packstücke','number'],['szr_kurs','Kurs € je SZR (Tageskurs)','number'],['restwert','Restwert (€)','eur']] },
  'Marine (Binnenschiff)': { wf:[
    ['Auftrag prüfen & bestätigen',0],['Schiffsdaten & aktuellen Liegeplatz klären',0],['Besichtigung vereinbaren',0,'termin'],
    ['Besichtigung an Bord / Werft',1],['Schiffsführer befragen, Schiffstagebuch sichern',1],['Reparaturangebot Werft prüfen',5,'pruefung'],
    ['Reparatur überwachen',20],['Werftrechnung prüfen',35,'pruefung'],['Havarie-grosse / Dispache prüfen',40],
    ['Gutachten erstellen',45,'gutachten'],['Honorar abrechnen',46],['Akte schließen',60]],
    felder:[['schiff','Schiffsname','text',null,1],['eni','ENI-Nummer','text',null,1],['schiffstyp','Schiffstyp','select',['GMS','TMS','SB/Schubverband','Fahrgastschiff','Sonstige']],
      ['eigner','Eigner / Reederei','text'],['schiffsfuehrer','Schiffsführer','text'],['revier','Revier / Fluss-km','text'],
      ['ereignis','Ereignis','select',['Kollision','Grundberührung','Anfahrung Brücke/Schleuse','Maschinenschaden','Ladungsschaden','Feuer','Sonstige'],1],
      ['havarie_grosse','Havarie-grosse erklärt?','select',['nein','ja','prüfen']],['ausfalltage','Ausfalltage','number']] },
};
const BASIS_VOR = [['schadentag','Schadentag','date',null,1],['ursache','Schadenursache','textarea',null,1],['befund','Befund / Feststellungen','textarea',null,1]];
const BASIS_NACH = [['deckung','Deckung gegeben?','select',['ja','nein','teilweise','offen'],1],['massnahmen','Empfohlene Maßnahmen','textarea'],
  ['schadenhoehe_netto','Ermittelte Schadenhöhe netto (€)','eur',null,1],['regress','Regressmöglichkeit','select',['keine','prüfen','ja']],['fazit','Fazit','textarea',null,1]];
const felder = a => [...BASIS_VOR, ...SPARTEN[a.sparte].felder, ...BASIS_NACH];

const ROLLEN = ['VN','Auftraggeber (VR)','Makler','Anspruchsteller','Anwalt','Hersteller','Händler','Frachtführer','Absender','Empfänger',
  'Reederei / Eigner','Schiffsführer','Werft','Handwerker / Sanierer','Steuerberater','Gegnerischer Versicherer','Polizei','Sonstige'];

/* ============================================================
   FRISTEN & BERECHNUNGEN je Sparte
   ============================================================ */
function fristen(a){
  const g=a.gutachten, f=[];
  if(a.sparte==='Transport' && g.ablieferung){
    const rg=g.rechtsgrundlage||'';
    if(g.erkennbar==='nicht erkennbar' && !g.vorbehalt){
      if(rg==='CMR') f.push({t:'Schadenanzeige verdeckter Schaden an Frachtführer',d:addOhneSonntag(g.ablieferung,7),b:'Art. 30 Abs. 1 CMR: 7 Tage, Sonn- und Feiertage nicht mitgerechnet (Feiertage hier nicht berücksichtigt)'});
      else if(rg.startsWith('CMNI')) f.push({t:'Schadenanzeige verdeckter Schaden',d:addDays(g.ablieferung,7),b:'Art. 23 CMNI: 7 aufeinanderfolgende Tage'});
      else if(rg.startsWith('HGB')) f.push({t:'Schadenanzeige verdeckter Schaden',d:addDays(g.ablieferung,7),b:'§ 438 Abs. 2 HGB: 7 Tage'});
    }
    if(g.erkennbar==='äußerlich erkennbar' && !g.vorbehalt) f.push({t:'Kein Vorbehalt bei Ablieferung dokumentiert – Beweislage prüfen',d:g.ablieferung,b:'Art. 30 CMR / § 438 Abs. 1 HGB'});
    f.push({t:'Verjährung Ansprüche gegen Frachtführer',d:addYears(g.ablieferung,1),b:'Art. 32 CMR / § 439 HGB / Art. 24 CMNI: 1 Jahr (bei Vorsatz/grobem Verschulden länger)'});
  }
  if(a.sparte==='Produkthaftpflicht'){
    if(g.kenntnis){
      f.push({t:'Verjährung nach ProdHaftG',d:addYears(g.kenntnis,3),b:'§ 12 ProdHaftG: 3 Jahre ab Kenntnis (Hemmung durch Verhandlungen möglich)'});
      f.push({t:'Verjährung deliktisch (§ 823 BGB)',d:`${D(g.kenntnis).getUTCFullYear()+3}-12-31`,b:'§§ 195, 199 BGB: 3 Jahre zum Jahresende'});
    }
    if(g.inverkehr) f.push({t:'Erlöschen ProdHaftG-Ansprüche',d:addYears(g.inverkehr,10),b:'§ 13 ProdHaftG: 10 Jahre nach Inverkehrbringen'});
  }
  return f.sort((x,y)=>x.d.localeCompare(y.d));
}
function buMonate(a){
  const g=a.gutachten, n=Math.min(36,+g.haftzeit||0); if(!g.unterbrechung_von||!n) return [];
  a.bu=a.bu||{werte:[],varQuote:'',smk:''};
  return Array.from({length:n},(_,i)=>{ a.bu.werte[i]=a.bu.werte[i]||{soll:'',ist:''};
    return {i,von:addMonths(g.unterbrechung_von,i),bis:addDays(addMonths(g.unterbrechung_von,i+1),-1),...a.bu.werte[i]}; });
}
/* Liefert Ergebniszeilen [label, wert] und Hinweise – genutzt in UI und PDF */
function berechnung(a){
  const g=a.gutachten, rows=[], hints=[], S=num(g.schadenhoehe_netto);
  if(['Gebäude','Hausrat','Inhalt'].includes(a.sparte)){
    const vs=num(g.vs), vw=num(g.vw);
    if(vs&&vw){ const q=Math.min(1,vs/vw);
      rows.push(['Versicherungssumme',eur(vs)],['Versicherungswert lt. SV',eur(vw)],['Deckungsquote',(q*100).toFixed(1)+' %']);
      if(S!=null) rows.push(['Entschädigung nach Proportionalitätsregel (§ 75 VVG)',eur(S*q)]);
      if(q<1) hints.push('Unterversicherung festgestellt. Vertraglichen Unterversicherungsverzicht und die dafür geltenden Voraussetzungen prüfen.');
    } else hints.push('Für die Unterversicherungsprüfung Versicherungssumme und Versicherungswert eintragen.');
    if(a.sparte==='Inhalt'){ const e=num(g.einrichtung_wert)||0, v=num(g.vorraete_wert)||0, r=num(g.restwert)||0;
      if(e||v) rows.push(['Einrichtung + Vorräte − Restwerte',eur(e+v-r)]); }
  }
  if(a.sparte==='Betriebsunterbrechung'){
    const m=buMonate(a); let ausfall=0, offen=0;
    m.forEach(x=>{ if(x.soll!==''&&x.ist!=='') ausfall+=Math.max(0,x.soll-x.ist); else if(x.bis<TODAY()) offen++; });
    const vq=num(a.bu?.varQuote)||0, smk=num(a.bu?.smk)||0;
    rows.push(['Umsatzausfall (Soll − Ist)',eur(ausfall)],[`abzgl. ersparte variable Kosten (${vq} %)`,eur(-ausfall*vq/100)],
      ['zzgl. Schadenminderungskosten',eur(smk)],['Unterbrechungsschaden (vereinfacht)',eur(ausfall*(1-vq/100)+smk)]);
    if(offen) hints.push(`${offen} abgelaufene Monat(e) ohne Ist-Umsatz.`);
    hints.push('Vereinfachtes Umsatzverfahren. Maßgeblich sind die vereinbarten Bedingungen (fortlaufende Kosten + entgangener Betriebsgewinn, Haftzeit, Selbstbehalt).');
  }
  if(a.sparte==='Transport'){
    const rg=g.rechtsgrundlage||'', kg=num(g.gewicht_kg), kurs=num(g.szr_kurs), pk=num(g.packstuecke);
    let szr=null, basis='';
    if((rg==='CMR'||rg.startsWith('HGB')) && kg){ szr=kg*8.33; basis=rg==='CMR'?'Art. 23 Abs. 3 CMR: 8,33 SZR/kg':'§ 431 Abs. 1 HGB: 8,33 SZR/kg'; }
    if(rg.startsWith('CMNI') && (kg||pk)){ szr=Math.max((pk||0)*666.67,(kg||0)*2); basis='Art. 20 CMNI: 666,67 SZR/Packstück oder 2 SZR/kg (höherer Betrag)'; }
    if(szr!=null){ rows.push(['Haftungshöchstbetrag',szr.toLocaleString('de-DE',{maximumFractionDigits:2})+' SZR']);
      if(kurs){ const h=szr*kurs; rows.push(['Haftungshöchstbetrag in €',eur(h)]);
        if(S!=null){ const r=num(g.restwert)||0; const sch=Math.max(0,S-r); rows.push(['Schaden abzgl. Restwert',eur(sch)],['Regressfähig (begrenzt)',eur(Math.min(sch,h))]);
          if(sch>h) hints.push('Schaden übersteigt den Höchstbetrag. Qualifiziertes Verschulden prüfen (Art. 29 CMR / § 435 HGB), dann ist die Haftung unbegrenzt.'); } }
      else hints.push('SZR-Tageskurs eintragen (maßgeblich ist der in der Rechtsgrundlage bestimmte Stichtag).');
      hints.push(basis); if(rg.startsWith('HGB')) hints.push('§ 449 HGB: Abweichende Haftungshöhe (2–40 SZR/kg) durch AGB möglich, z. B. ADSp. Vertragsgrundlage anfordern.');
    } else hints.push('Für den Höchstbetrag Rechtsgrundlage und Gewicht eintragen (bei CMNI auch die Packstücke).');
  }
  if(a.sparte==='Produkthaftpflicht'){
    if(S!=null){ rows.push(['Sachschaden',eur(S)],['Selbstbeteiligung § 11 ProdHaftG',eur(-500)],['Ersatzfähig nach ProdHaftG',eur(Math.max(0,S-500))]); }
    if(g.nutzung==='gewerblich') hints.push('Gewerblich genutzte Sache: Nach § 1 Abs. 1 S. 2 ProdHaftG kein Sachschadenersatz. Anspruch nur deliktisch (§ 823 BGB) oder vertraglich.');
    if(g.inverkehr && g.inverkehr>='2026-12-09') hints.push('Produkt nach dem 09.12.2026 in Verkehr gebracht: neue Produkthaftungsrichtlinie (EU) 2024/2853 bzw. deren Umsetzung prüfen (u. a. Wegfall der Selbstbeteiligung).');
  }
  if(a.sparte==='Marine (Binnenschiff)'){
    if(g.havarie_grosse==='ja') hints.push('Havarie-grosse erklärt: Dispacheur, Ladungsbeteiligte und Beitragswerte erfassen.');
    hints.push('Haftungsbeschränkung des Schiffseigners prüfen (BinSchG / CLNI). Bei Kollision Verklarung und Beweissicherung prüfen.');
    if(num(g.ausfalltage)) rows.push(['Ausfalltage',g.ausfalltage]);
  }
  return {rows,hints};
}

/* ============================================================
   DEMO-DATEN
   ============================================================ */
function mkAkte(o){
  const eingang=o.eingang||TODAY();

const bytesOf = s => Uint8Array.from(s,c=>c.charCodeAt(0)&255);
const dec = (bin,cs) => { try{ return new TextDecoder(cs||'utf-8').decode(bytesOf(bin)); }catch(e){ return bin; } };
const qp = s => s.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16)));
const words = s => (s||'').replace(/(\?=)\s+(=\?)/g,'$1$2').replace(/=\?([^?]+)\?([BQ])\?([^?]*)\?=/gi,(_,cs,e,t)=>
  dec(e.toUpperCase()==='B'?atob(t):qp(t.replace(/_/g,' ')),cs));
const param = (v,n) => { const m=(v||'').match(new RegExp(n+'\\*?=\\s*"?([^";\\r\\n]+)"?','i')); if(!m) return '';
  const r=m[1].match(/^([\w-]+)'[^']*'(.*)$/); if(r){ try{ return decodeURIComponent(r[2]); }catch(e){ return r[2]; } } return m[1]; };
function parsePart(s,out){
  const i=s.search(/\r?\n\r?\n/), h=i<0?s:s.slice(0,i), b=i<0?'':s.slice(i).replace(/^\r?\n\r?\n/,'');
  const H={}; h.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{const k=l.indexOf(':'); if(k>0){const n=l.slice(0,k).trim().toLowerCase(); if(!(n in H)) H[n]=l.slice(k+1).trim();}});
  if(!out.H) out.H=H;
  const ct=H['content-type']||'text/plain', enc=(H['content-transfer-encoding']||'').toLowerCase(), cs=param(ct,'charset')||'utf-8';
  if(/multipart\//i.test(ct)){ const bd=param(ct,'boundary'); b.split('--'+bd).slice(1).forEach(p=>{ if(!p.startsWith('--')) parsePart(p.replace(/^\r?\n/,''),out); }); return; }
  const disp=H['content-disposition']||'', fn=words(dec(param(disp,'filename')||param(ct,'name'),'utf-8'));
  if(fn||/attachment/i.test(disp)){ out.anhaenge.push(fn||'Anhang'); return; }
  const body = enc==='base64' ? atob(b.replace(/\s+/g,'')) : enc==='quoted-printable' ? qp(b) : b;
  if(/text\/plain/i.test(ct) && !out.text) out.text=dec(body,cs);
  else if(/text\/html/i.test(ct) && !out.html) out.html=dec(body,cs);
}
function parseEml(bytes){
  const raw=new TextDecoder('latin1').decode(bytes), out={anhaenge:[]}; parsePart(raw,out);

  const H=out.H||{}, from=words(dec(H.from||'','utf-8')), dt=new Date(H.date);
  return {von:((from.match(/<([^>]+)>/)||[])[1]||from).trim(),betreff:words(dec(H.subject||'(ohne Betreff)','utf-8')),
    datum:isNaN(dt)?TODAY():iso(dt),text:(text||'').replace(/\n{3,}/g,'\n\n').trim(),anhaenge:out.anhaenge};
}
async function importEml(files){

/* ============================================================
   ROUTENPLANUNG – Nächster Nachbar ab Büro, Übergabe an Google Maps
   ============================================================ */
const BUERO={lat:50.9375,lon:6.9603,ort:'Köln'};
function dist(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function route(stops){
  const rest=stops.filter(s=>s.lat!=null&&s.lon!=null), order=[]; let cur=BUERO, km=0;
  while(rest.length){ rest.sort((x,y)=>dist(cur,x)-dist(cur,y)); const n=rest.shift(); km+=dist(cur,n); order.push(n); cur=n; }
  if(order.length) km+=dist(cur,BUERO);
  return {order,km:km*1.3,ohne:stops.filter(s=>s.lat==null||s.lon==null)};
}

  <div><div class="card"><h2>Stand</h2><p>Eingang ${fmt(a.eingang)} · ${daysBetween(a.eingang,TODAY())} Tage · Workflow ${d}/${a.workflow.length}</p>
    <div style="height:8px;background:var(--line);border-radius:4px"><div style="height:8px;width:${100*d/a.workflow.length}%;background:var(--accent);border-radius:4px"></div></div>
    <p class="row" style="margin-top:10px"><a class="btn" href="tel:${esc(a.tel)}">📞 Anrufen</a><a class="btn" href="${mailto(a.mail,a.az+' / '+a.schadennr)}">✉ E-Mail an VN</a></p>
    ${verk.length?`<h3>Verknüpfte Akten (gleiches Ereignis)</h3>${verk.map(b=>`<div><a href="#" onclick="openAkte('${b.id}');return false">${esc(b.az)}</a> – ${esc(b.sparte)}</div>`).join('')}`:''}</div>
  <div class="card"><h2>Offene Aufgaben</h2>${t.length?t.map(x=>taskHtml(x,false)).join(''):'<p class="muted">Keine</p>'}</div>
  <div class="card"><h2>Verlauf</h2>${a.notizen.slice(0,10).map(n=>`<div class="muted" style="font-size:12px">${fmt(n.datum)} · ${esc(n.text)}</div>`).join('')}</div></div></div>`;
}
function tWorkflow(a){
  return `<div class="card"><h2>Workflow dieser Akte</h2><p class="muted">Vorlage: ${esc(a.sparte)}. Änderungen gelten nur für diese Akte.</p>
  ${a.workflow.map((s,i)=>`<div class="step ${s.done?'done':''}"><input type="checkbox" style="width:auto" ${s.done?'checked':''} onchange="wfToggle('${a.id}',${i})">
    <span style="flex:1">${esc(s.t)}</span><input type="date" value="${s.faellig}" style="width:150px" onchange="wfDate('${a.id}',${i},this.value)">
    <button class="btn" onclick="wfMove('${a.id}',${i},-1)">↑</button><button class="btn" onclick="wfMove('${a.id}',${i},1)">↓</button><button class="btn" onclick="wfDel('${a.id}',${i})">✕</button></div>`).join('')}
  <div class="row" style="margin-top:10px"><input id="wf_neu" placeholder="Zusätzlicher Schritt, z. B. Statiker hinzuziehen" style="flex:1"><input id="wf_tage" type="number" value="3" style="width:80px" title="Tage ab heute"><button class="btn primary" onclick="wfAdd('${a.id}')">+ Schritt</button></div></div>`;
}
function wfToggle(id,i){const a=A(id),s=a.workflow[i];s.done=!s.done;if(s.done)log(a,'Workflow: „'+s.t+'“ erledigt');save();render();}
function wfDate(id,i,v){A(id).workflow[i].faellig=v;save();}
function wfMove(id,i,d){const w=A(id).workflow,j=i+d;if(j<0||j>=w.length)return;[w[i],w[j]]=[w[j],w[i]];save();render();}
function wfDel(id,i){A(id).workflow.splice(i,1);save();render();}
function wfAdd(id){const t=val('wf_neu');if(!t)return;const a=A(id);a.workflow.push({id:uid(),t,d:0,done:false,faellig:addDays(TODAY(),+val('wf_tage')||0)});log(a,'Workflow-Schritt ergänzt: '+t);save();render();}
function tKomm(a){
  const alle=[a.mail,a.auftraggeberMail,...a.beteiligte.map(b=>b.mail)].filter(Boolean);
  return `<div class="grid"><div class="card"><h2>E-Mails</h2>${a.emails.length?a.emails.map(m=>`<div class="task"><div style="flex:1"><b>${esc(m.betreff)}</b> <span class="muted">${esc(m.von)} · ${fmt(m.datum)}</span>
      <pre style="white-space:pre-wrap;font:inherit;margin:4px 0;max-height:180px;overflow:auto">${esc(m.text)}</pre>${(m.anhaenge||[]).map(x=>`<span class="pill">📎 ${esc(x)}</span> `).join('')}
      <div class="row" style="margin-top:4px"><a class="btn" href="${mailto(m.von,'AW: '+m.betreff+' ['+a.az+']','\n\n----- Ursprüngliche Nachricht -----\n'+m.text)}">Antworten</a>
      ${m.erledigt?'<span class="ok">✓ erledigt</span>':`<button class="btn" onclick="mailErledigt('${a.id}','${m.id}')">Erledigt</button>`}</div></div></div>`).join(''):'<p class="muted">Keine</p>'}
    <p class="row"><a class="btn" href="${mailto(a.mail,a.az+' / '+a.schadennr)}">Neue E-Mail an VN</a>${alle.length>1?`<a class="btn" href="${mailto(alle.join(','),a.az+' / '+a.schadennr)}">An alle Beteiligten</a>`:''}</p>
    <p class="muted" style="font-size:12px">Ausgehende Mails nennen das Aktenzeichen im Betreff. Antworten werden dadurch beim Import automatisch zugeordnet.</p></div>
  <div class="card"><h2>Telefonnotiz</h2><label>Gesprächspartner</label><select id="t_mit">${[a.vn,...a.beteiligte.map(b=>b.rolle+': '+(b.name||b.firma))].map(x=>`<option>${esc(x)}</option>`).join('')}<option>Sonstige</option></select>
    <label>Inhalt</label><textarea id="t_text"></textarea>
    <label>Wiedervorlage in Tagen (optional, erzeugt Aufgabe)</label><input id="t_wv" type="number">
    <p><button class="btn primary" onclick="telefonat('${a.id}')">Speichern</button></p>
    <h3>Notizen & Verlauf</h3>${a.notizen.map(n=>`<div style="font-size:12px;padding:3px 0"><span class="muted">${fmt(n.datum)} · ${n.typ}</span> ${esc(n.text)}</div>`).join('')}</div></div>`;
}
function mailErledigt(id,mid){A(id).emails.find(m=>m.id===mid).erledigt=true;save();render();}
function telefonat(id){
  const a=A(id),txt=val('t_text');if(!txt)return;
  log(a,val('t_mit')+': '+txt,'telefon');
  const wv=+val('t_wv'); if(wv){ const i=a.workflow.findIndex(s=>!s.done); a.workflow.splice(i<0?a.workflow.length:i,0,{id:uid(),t:'Wiedervorlage: '+txt.slice(0,60),d:0,done:false,faellig:addDays(TODAY(),wv)}); }
  if(/termin|uhr\b|montag|dienstag|mittwoch|donnerstag|freitag/i.test(txt)){ TAB='termine'; alert('Im Gespräch wurde offenbar ein Termin besprochen. Bitte jetzt eintragen.'); }
  save();render();
}
function tBeteiligte(a){
  return `<div class="card"><h2>Beteiligte</h2><p class="muted">Absender, die hier erfasst sind, werden beim Mail-Import automatisch dieser Akte zugeordnet. Das gilt auch für ihre Zeichen im Mailtext.</p>
  <table><tr><th>Rolle</th><th>Name</th><th>Firma</th><th>E-Mail</th><th>Telefon</th><th>Deren Zeichen</th><th></th></tr>
  ${a.beteiligte.map((b,i)=>`<tr>${['rolle','name','firma','mail','tel','az'].map(k=>`<td>${k==='rolle'?`<select onchange="bSet('${a.id}',${i},'rolle',this.value)">${ROLLEN.map(r=>`<option ${b.rolle===r?'selected':''}>${r}</option>`).join('')}</select>`:
    `<input value="${esc(b[k])}" onchange="bSet('${a.id}',${i},'${k}',this.value)">`}</td>`).join('')}<td><button class="btn" onclick="A('${a.id}').beteiligte.splice(${i},1);save();render()">✕</button></td></tr>`).join('')}
  </table><p><button class="btn primary" onclick="A('${a.id}').beteiligte.push({id:uid(),rolle:'Sonstige',name:'',firma:'',mail:'',tel:'',az:''});save();render()">+ Beteiligter</button></p></div>`;
}
function bSet(id,i,k,v){A(id).beteiligte[i][k]=v;save();}
function tTermine(a){
  return `<div class="card"><h2>Termine</h2><table><tr><th>Datum</th><th>Zeit</th><th>Art / Ort</th><th>Protokoll</th></tr>
  ${a.termine.map((t,i)=>`<tr><td>${fmt(t.datum)}</td><td>${t.zeit}</td><td>${esc(t.art)}<br><span class="muted">${esc(t.ort)}</span></td><td><textarea onchange="A('${a.id}').termine[${i}].protokoll=this.value;save()" placeholder="Protokoll / Feststellungen / Anwesende">${esc(t.protokoll||'')}</textarea></td></tr>`).join('')}</table>
  <h3>Neuer Termin</h3><div class="grid"><div><label>Datum</label><input id="tm_d" type="date" value="${addDays(TODAY(),2)}"></div><div><label>Uhrzeit</label><input id="tm_z" type="time" value="10:00"></div>
  <div><label>Art</label><select id="tm_a"><option>Ortstermin</option><option>Besichtigung</option><option>Gemeinsame Besichtigung</option><option>Nachbesichtigung</option><option>Werftbesichtigung</option><option>Telefontermin</option></select></div>
  <div><label>Ort (abweichend, z. B. Liegeplatz/Werft)</label><input id="tm_o" value="${esc(a.ort)}"></div></div>
  <p><button class="btn primary" onclick="terminAdd('${a.id}')">Termin anlegen</button> <span class="muted">Erzeugt Vorbereitungs- und Protokoll-Erinnerungen und hakt den Schritt „vereinbaren“ ab.</span></p></div>`;
}
function terminAdd(id){
  const a=A(id), ort=val('tm_o'), gleich=ort===a.ort;
  a.termine.push({id:uid(),datum:val('tm_d'),zeit:val('tm_z'),art:val('tm_a'),ort,lat:gleich?a.lat:null,lon:gleich?a.lon:null});
  const s=a.workflow.find(s=>s.kind==='termin'&&!s.done); if(s) s.done=true;
  const i=a.workflow.indexOf(s), n=i>=0?a.workflow[i+1]:null; if(n&&!n.done) n.faellig=val('tm_d');
  log(a,`Termin ${val('tm_a')} am ${fmt(val('tm_d'))} ${val('tm_z')} angelegt`);save();render();
}
function tGutachten(a){
  const g=a.gutachten;
  const field=([k,l,typ,opt,pf])=>`<div><label>${esc(l)}${pf?' *':''}</label>${typ==='textarea'?`<textarea onchange="gSet('${a.id}','${k}',this.value)">${esc(g[k]||'')}</textarea>`:
    typ==='select'?`<select onchange="gSet('${a.id}','${k}',this.value,1)"><option></option>${opt.map(o=>`<option ${g[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:
    `<input type="${typ==='eur'?'number':typ}" ${typ==='eur'?'step="0.01"':''} value="${esc(g[k]||'')}" onchange="gSet('${a.id}','${k}',this.value,${typ==='date'?1:0})">`}</div>`;
  const ausPr=a.pruefungen.reduce((s,p)=>s+summen(p).anr,0), B=berechnung(a);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Gutachten-Maske ${esc(a.sparte)}</h2><button class="btn primary" onclick="pdfGutachten(A('${a.id}'))">PDF erstellen</button></div>
  <p class="muted">Jedes Feld ist ein Datenfeld der Akte und damit auswertbar und durchsuchbar. Fristen und Berechnungen werden daraus automatisch abgeleitet. * = Pflichtfeld.
  ${ausPr?`<br>Anerkannte Summe aus Prüfungen: <b>${eur(ausPr)}</b> <button class="btn" onclick="gSet('${a.id}','schadenhoehe_netto','${ausPr.toFixed(2)}',1)">übernehmen</button>`:''}</p>
  <h3>Allgemein</h3><div class="grid">${BASIS_VOR.map(field).join('')}</div>
  <h3>${esc(a.sparte)}</h3><div class="grid">${SPARTEN[a.sparte].felder.map(field).join('')}</div>
  <h3>Ergebnis</h3><div class="grid">${BASIS_NACH.map(field).join('')}</div>
  ${B.hints.map(h=>`<div class="hint">${esc(h)}</div>`).join('')}</div>`;
}
function gSet(id,k,v,re){A(id).gutachten[k]=v;save();if(re)render();}
function tBerechnung(a){
  const B=berechnung(a), F=fristen(a);
  let bu='';
  if(a.sparte==='Betriebsunterbrechung'){
    const m=buMonate(a);
    bu=m.length?`<h3>Monatswerte Haftzeit</h3><table class="res"><tr><th>Monat</th><th>Soll-Umsatz (€)</th><th>Ist-Umsatz (€)</th><th>Ausfall</th></tr>
      ${m.map(x=>`<tr><td>${fmt(x.von)} – ${fmt(x.bis)}</td>${['soll','ist'].map(k=>`<td><input type="number" value="${x[k]}" onchange="buSet('${a.id}',${x.i},'${k}',this.value)"></td>`).join('')}
        <td class="${x.ist===''&&x.bis<TODAY()?'warn':''}">${x.soll!==''&&x.ist!==''?eur(Math.max(0,x.soll-x.ist)):x.bis<TODAY()?'fehlt':'—'}</td></tr>`).join('')}</table>
      <div class="grid"><div><label>Ersparte variable Kosten (% vom Umsatz)</label><input type="number" value="${esc(a.bu.varQuote)}" onchange="A('${a.id}').bu.varQuote=this.value;save();render()"></div>
      <div><label>Schadenminderungskosten (€)</label><input type="number" value="${esc(a.bu.smk)}" onchange="A('${a.id}').bu.smk=this.value;save();render()"></div></div>`
      :'<p class="warn">In der Gutachten-Maske „Unterbrechung ab“ und „Haftzeit“ eintragen.</p>';
  }
  return `<div class="grid"><div class="card"><h2>Berechnung</h2>${bu}
    ${B.rows.length?`<table class="res">${B.rows.map(([l,v],i)=>`<tr><td>${i===B.rows.length-1?'<b>'+esc(l)+'</b>':esc(l)}</td><td>${i===B.rows.length-1?'<b>'+esc(v)+'</b>':esc(v)}</td></tr>`).join('')}</table>`:''}
    ${B.hints.map(h=>`<div class="hint">${esc(h)}</div>`).join('')}</div>
  <div class="card"><h2>Fristen</h2>${F.length?`<table>${F.map(f=>{const d=daysBetween(TODAY(),f.d);return `<tr><td class="${d<0?'bad':d<=30?'warn':''}"><b>${fmt(f.d)}</b><br><span style="font-size:12px">${d<0?'abgelaufen':'in '+d+' Tagen'}</span></td><td>${esc(f.t)}<br><span class="muted" style="font-size:12px">${esc(f.b)}</span></td></tr>`}).join('')}</table>`
    :'<p class="muted">Für diese Sparte bzw. mit den bisherigen Daten keine Fristen ableitbar.</p>'}
    <p class="muted" style="font-size:12px">Arbeitshilfe, keine Rechtsberatung. Hemmung, Unterbrechung und abweichende Vereinbarungen werden nicht berücksichtigt.</p></div></div>`;
}
function buSet(id,i,k,v){A(id).bu.werte[i][k]=v===''?'':Number(v);save();render();}
function tPruefung(a){
  return a.pruefungen.map((p,pi)=>{const s=summen(p);return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${p.typ}: ${esc(p.firma)} <span class="muted">${fmt(p.datum)}</span></h2>
    <button class="btn primary" onclick="pdfPruefung(A('${a.id}'),A('${a.id}').pruefungen[${pi}])">Prüfbericht PDF</button></div>
  <table><tr><th>Position</th><th>Menge</th><th>EP gefordert</th><th>EP anerkannt</th><th>Kürzung</th></tr>
  ${p.positionen.map((x,i)=>`<tr><td><input value="${esc(x.text)}" onchange="pSet('${a.id}',${pi},${i},'text',this.value)"></td>
    <td><input type="number" value="${x.menge}" style="width:80px" onchange="pSet('${a.id}',${pi},${i},'menge',+this.value)"> ${esc(x.einheit)}</td>
    <td><input type="number" step="0.01" value="${x.ep}" onchange="pSet('${a.id}',${pi},${i},'ep',+this.value)"></td>
    <td><input type="number" step="0.01" value="${x.anerkannt_ep}" onchange="pSet('${a.id}',${pi},${i},'anerkannt_ep',+this.value)"></td>
    <td class="${x.ep>x.anerkannt_ep?'bad':''}">${eur(x.menge*(x.ep-x.anerkannt_ep))}</td></tr>`).join('')}
  <tr><td colspan="2"><button class="btn" onclick="pPos('${a.id}',${pi})">+ Position</button></td><td><b>${eur(s.gef)}</b></td><td><b>${eur(s.anr)}</b></td><td class="bad"><b>${eur(s.gef-s.anr)} (${s.gef?Math.round(100*(s.gef-s.anr)/s.gef):0} %)</b></td></tr></table>
  <label>Bemerkung</label><textarea onchange="A('${a.id}').pruefungen[${pi}].bemerkung=this.value;save()">${esc(p.bemerkung)}</textarea></div>`}).join('')+
  `<div class="card"><h2>Neue Prüfung</h2><div class="grid"><div><label>Typ</label><select id="p_typ"><option>Angebot</option><option>Rechnung</option><option>Werftrechnung</option><option>Forderung Anspruchsteller</option></select></div>
    <div><label>Firma / Anspruchsteller</label><input id="p_firma"></div><div><label>Datum Beleg</label><input id="p_dat" type="date" value="${TODAY()}"></div></div>
    <p><button class="btn primary" onclick="pNeu('${a.id}')">Anlegen</button></p></div>`;
}
function pSet(id,pi,i,k,v){A(id).pruefungen[pi].positionen[i][k]=v;save();render();}
function pPos(id,pi){A(id).pruefungen[pi].positionen.push({text:'',menge:1,einheit:'Stk',ep:0,anerkannt_ep:0});save();render();}
function pNeu(id){const f=val('p_firma');if(!f)return;const a=A(id);a.pruefungen.push({id:uid(),typ:val('p_typ'),firma:f,datum:val('p_dat'),positionen:[],bemerkung:''});log(a,val('p_typ')+'sprüfung angelegt: '+f);save();render();}

render();
</script>
</body>
</html>
